name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Shivangi-Sharma06

          # ===== ONLY THE 3 THINGS YOU WANT =====
          base: header

          # GitHub stats (commits, PRs, etc)
          plugin_activity: yes

          # Streak
          plugin_streak: yes

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # ===== clean minimal look =====
          template: classic
          theme: dark
          config_timezone: Asia/Kolkata
